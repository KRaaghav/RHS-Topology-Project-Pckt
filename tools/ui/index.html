<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetCheck</title>
<link rel="stylesheet" href="style.css">
<script>
  // set the theme before anything is drawn, so the page does not flash
  try { document.documentElement.dataset.theme = localStorage.getItem('netcheck-theme') || 'dark'; } catch (e) {}
</script>
</head>
<body>
<div id="root"><div class="boot"><div class="boot-mark"></div><p>Reading the lab...</p></div></div>
<!-- React and htm are saved in vendor/, so the page also works without internet -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
